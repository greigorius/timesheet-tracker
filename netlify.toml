[build]
  command   = "npm install && npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Raise function timeout to the Netlify maximum (26s) for all functions.
# notion-proxy needs this on cold starts (fetches 4+ Notion relation DBs).
[functions."*"]
  timeout_seconds = 26

# Reference page — serve its own HTML (must come BEFORE SPA fallback)
[[redirects]]
  from   = "/reference"
  to     = "/reference.html"
  status = 200

# SPA fallback — serve index.html for any unmatched route
# (must come AFTER functions so /.netlify/functions/* is not caught)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
