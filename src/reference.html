<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DKH Reference — Clients, Projects & Items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0E1117;--surface:#161B27;--surface2:#1C2333;--surface3:#212840;
  --border:#253352;--border2:#334666;
  --text:#E2E8F0;--muted:#94A3B8;--dim:#64748B;
  --blue:#3B82F6;--blue-dim:#1D3A6E;--blue-bright:#60A5FA;
  --green:#10B981;--green-dim:#0D3326;
  --amber:#F59E0B;--amber-dim:#3B2800;
  --red:#EF4444;--red-dim:#3B0D0D;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
html{font-size:14px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;line-height:1.5}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── HEADER ── */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between}
.hdr-l{display:flex;align-items:center;gap:14px}
.wordmark{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);letter-spacing:.08em}
.wordmark span{color:var(--blue)}
.vsep{width:1px;height:18px;background:var(--border)}
.pg-title{font-size:12px;color:var(--muted)}
.hdr-r{display:flex;align-items:center;gap:12px}
.last-updated{font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ── INTRO ── */
.intro{background:var(--blue-dim);border:1px solid rgba(59,130,246,.3);border-radius:4px;padding:12px 16px;margin:16px 24px 0;display:flex;align-items:flex-start;gap:10px;font-size:12px;color:var(--blue-bright);line-height:1.6}
.intro strong{font-weight:600}

/* ── MAIN ── */
.main{padding:16px 24px;display:grid;grid-template-columns:200px 240px 1fr;gap:14px;align-items:start}

/* ── PANEL ── */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface2);gap:8px}
.pt{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ph-r{display:flex;align-items:center;gap:6px}
.count-badge{font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ── SEARCH ── */
.search-wrap{padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:var(--mono);font-size:11px;padding:5px 9px;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--blue)}
.search-input::placeholder{color:var(--dim)}

/* ── LIST ── */
.ref-list{max-height:520px;overflow-y:auto}
.ref-item{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid rgba(37,51,82,.5);gap:8px;cursor:pointer;transition:background .1s}
.ref-item:last-child{border-bottom:none}
.ref-item:hover{background:var(--surface2)}
.ref-item.copied{background:rgba(16,185,129,.08)}
.ref-name{font-family:var(--mono);font-size:11px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref-name.dim-name{color:var(--muted)}
.ref-code{font-family:var(--mono);font-size:10px;color:var(--dim);flex-shrink:0}
.copy-icon{font-size:11px;color:var(--dim);flex-shrink:0;opacity:0;transition:opacity .15s}
.ref-item:hover .copy-icon{opacity:1}
.ref-item.copied .copy-icon{opacity:1;color:var(--green)}

/* item section header */
.ref-section-hdr{padding:5px 12px;background:var(--surface2);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;position:sticky;top:0;z-index:1}

/* ── EMPTY / LOADING ── */
.empty{padding:24px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:11px;line-height:2}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}

/* ── COPY TOAST ── */
.copy-toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--surface2);border:1px solid var(--green);border-radius:4px;
  padding:7px 16px;font-family:var(--mono);font-size:11px;color:var(--green);
  transition:transform .2s cubic-bezier(.22,1,.36,1);white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:999
}
.copy-toast.show{transform:translateX(-50%) translateY(0)}

/* ── REFRESH BTN ── */
.pill-btn{font-family:var(--mono);font-size:10px;color:var(--muted);background:none;border:1px solid var(--border);padding:3px 9px;border-radius:2px;cursor:pointer;transition:all .15s;white-space:nowrap}
.pill-btn:hover{color:var(--text);border-color:var(--border2)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <div class="wordmark">DK<span>H</span></div>
    <div class="vsep"></div>
    <div class="pg-title">Timesheet Reference</div>
  </div>
  <div class="hdr-r">
    <span class="last-updated" id="lastUpdated"></span>
    <button class="pill-btn" onclick="loadAll()">↻ Refresh</button>
  </div>
</header>

<div class="intro">
  <span>ℹ</span>
  <div><strong>Copy-paste reference for timesheet entry.</strong> Click any row to copy the exact name to your clipboard — paste it directly into your timesheet to ensure a precise match when importing.</div>
</div>

<div class="main">

  <!-- CLIENTS -->
  <div class="panel">
    <div class="ph">
      <div class="pt">Clients</div>
      <div class="ph-r"><span class="count-badge" id="clientCount"></span></div>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="clientSearch" placeholder="Search clients…" oninput="filterList('client')">
    </div>
    <div class="ref-list" id="clientList">
      <div class="empty"><span class="spin"></span><br>Loading…</div>
    </div>
  </div>

  <!-- PROJECTS -->
  <div class="panel">
    <div class="ph">
      <div class="pt">Projects</div>
      <div class="ph-r"><span class="count-badge" id="projectCount"></span></div>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="projectSearch" placeholder="Search projects…" oninput="filterList('project')">
    </div>
    <div class="ref-list" id="projectList">
      <div class="empty"><span class="spin"></span><br>Loading…</div>
    </div>
  </div>

  <!-- ITEMS -->
  <div class="panel">
    <div class="ph">
      <div class="pt">Items</div>
      <div class="ph-r"><span class="count-badge" id="itemCount"></span></div>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="itemSearch" placeholder="Search items…" oninput="filterList('item')">
    </div>
    <div class="ref-list" id="itemList">
      <div class="empty"><span class="spin"></span><br>Loading…</div>
    </div>
  </div>

</div>

<!-- Copy confirmation toast -->
<div class="copy-toast" id="copyToast"></div>

<script>
const PROXY = '/.netlify/functions/notion-proxy';

let allClients  = [];
let allProjects = [];
let allItems    = [];

async function loadAll(){
  setLoading();
  try{
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'reference-data' })
    });
    if(!res.ok) throw new Error('Proxy returned ' + res.status);
    const data = await res.json();
    allClients  = (data.clients  || []).sort((a,b) => a.name.localeCompare(b.name));
    allProjects = (data.projects || []).sort((a,b) => a.name.localeCompare(b.name));
    allItems    = (data.items    || []).sort((a,b) => {
      // Sort by code prefix numerically where possible
      const na = parseFloat(a.code) || 0;
      const nb = parseFloat(b.code) || 0;
      if(na && nb && na !== nb) return na - nb;
      return a.name.localeCompare(b.name);
    });
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB',{hour12:false});
    renderAll();
  } catch(e){
    ['clientList','projectList','itemList'].forEach(id => {
      document.getElementById(id).innerHTML =
        '<div class="empty" style="color:var(--red)">Load failed:<br>' + esc(e.message) + '</div>';
    });
  }
}

function setLoading(){
  ['clientList','projectList','itemList'].forEach(id => {
    document.getElementById(id).innerHTML =
      '<div class="empty"><span class="spin"></span><br>Loading…</div>';
  });
  document.getElementById('clientCount').textContent  = '';
  document.getElementById('projectCount').textContent = '';
  document.getElementById('itemCount').textContent    = '';
}

function renderAll(){
  filterList('client');
  filterList('project');
  filterList('item');
}

function filterList(type){
  const searchEl = document.getElementById(type + 'Search');
  const q = searchEl ? searchEl.value.trim().toLowerCase() : '';

  if(type === 'client'){
    const items = q ? allClients.filter(c => c.name.toLowerCase().includes(q)) : allClients;
    document.getElementById('clientCount').textContent = items.length + ' of ' + allClients.length;
    document.getElementById('clientList').innerHTML = items.length
      ? items.map(c => itemRow(c.name, '', c.name)).join('')
      : '<div class="empty">No matches.</div>';

  } else if(type === 'project'){
    const items = q ? allProjects.filter(p => p.name.toLowerCase().includes(q)) : allProjects;
    document.getElementById('projectCount').textContent = items.length + ' of ' + allProjects.length;
    document.getElementById('projectList').innerHTML = items.length
      ? items.map(p => itemRow(p.name, '', p.name)).join('')
      : '<div class="empty">No matches.</div>';

  } else if(type === 'item'){
    const items = q
      ? allItems.filter(i => i.name.toLowerCase().includes(q) || (i.code||'').toLowerCase().includes(q) || (i.project||'').toLowerCase().includes(q))
      : allItems;
    document.getElementById('itemCount').textContent = items.length + ' of ' + allItems.length;

    if(!items.length){
      document.getElementById('itemList').innerHTML = '<div class="empty">No matches.</div>';
      return;
    }

    // Group by project
    const byProject = {};
    const noProject = [];
    items.forEach(it => {
      if(it.project){
        if(!byProject[it.project]) byProject[it.project] = [];
        byProject[it.project].push(it);
      } else {
        noProject.push(it);
      }
    });

    let html = '';
    const projects = Object.keys(byProject).sort();
    projects.forEach(proj => {
      html += `<div class="ref-section-hdr">${esc(proj)}</div>`;
      html += byProject[proj]
        .sort((a,b) => a.name.localeCompare(b.name))
        .map(it => itemRow(it.name, it.code, it.name)).join('');
    });
    if(noProject.length){
      html += `<div class="ref-section-hdr">— No project —</div>`;
      html += noProject.map(it => itemRow(it.name, it.code, it.name)).join('');
    }

    document.getElementById('itemList').innerHTML = html;
  }
}

function itemRow(displayName, code, copyValue){
  const codeHtml = code ? `<span class="ref-code">${esc(code)}</span>` : '';
  return `<div class="ref-item" onclick="copyText('${esc(copyValue).replace(/'/g,"&#39;")}', this)" title="Click to copy: ${esc(copyValue)}">
    <span class="ref-name">${esc(displayName)}</span>
    ${codeHtml}
    <span class="copy-icon">⎘</span>
  </div>`;
}

let _toastTimer;
function copyText(text, el){
  // Decode HTML entities if needed
  const decoded = new DOMParser().parseFromString(text, 'text/html').body.textContent;
  navigator.clipboard.writeText(decoded).then(()=>{
    // Flash row
    if(el){
      el.classList.add('copied');
      el.querySelector('.copy-icon').textContent = '✓';
      setTimeout(()=>{
        el.classList.remove('copied');
        el.querySelector('.copy-icon').textContent = '⎘';
      }, 1400);
    }
    // Show toast
    const toast = document.getElementById('copyToast');
    toast.textContent = 'Copied: ' + decoded;
    toast.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
  }).catch(()=>{
    // Fallback: select text in a temporary input
    const inp = document.createElement('input');
    inp.value = decoded;
    document.body.appendChild(inp);
    inp.select();
    document.execCommand('copy');
    inp.remove();
  });
}

function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Auto-load on page open
loadAll();
</script>
</body>
</html>
