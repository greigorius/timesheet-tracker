<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DKH Reference — Clients, Projects & Items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0E1117;--surface:#161B27;--surface2:#1C2333;--surface3:#212840;
  --border:#253352;--border2:#334666;
  --text:#E2E8F0;--muted:#94A3B8;--dim:#64748B;
  --blue:#3B82F6;--blue-dim:#1D3A6E;--blue-bright:#60A5FA;
  --green:#10B981;--green-dim:#0D3326;
  --amber:#F59E0B;--amber-dim:#3B2800;
  --red:#EF4444;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
html{font-size:14px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;line-height:1.5}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── HEADER ── */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hdr-l{display:flex;align-items:center;gap:14px}
.wordmark{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);letter-spacing:.08em}
.wordmark span{color:var(--blue)}
.vsep{width:1px;height:18px;background:var(--border)}
.pg-title{font-size:12px;color:var(--muted)}
.hdr-r{display:flex;align-items:center;gap:12px}
.last-updated{font-family:var(--mono);font-size:10px;color:var(--dim)}
.pill-btn{font-family:var(--mono);font-size:10px;color:var(--muted);background:none;border:1px solid var(--border);padding:3px 9px;border-radius:2px;cursor:pointer;transition:all .15s;white-space:nowrap}
.pill-btn:hover{color:var(--text);border-color:var(--border2)}

/* ── INTRO ── */
.intro{background:var(--blue-dim);border:1px solid rgba(59,130,246,.25);border-radius:4px;padding:11px 16px;margin:16px 24px 0;font-size:12px;color:var(--blue-bright);line-height:1.6;display:flex;gap:10px;align-items:flex-start}

/* ── GLOBAL SEARCH ── */
.global-search-wrap{padding:12px 24px 0}
.global-search{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:12px;padding:7px 12px;outline:none;transition:border-color .15s}
.global-search:focus{border-color:var(--blue)}
.global-search::placeholder{color:var(--dim)}

/* ── MAIN 3-COL ── */
.main{padding:14px 24px 32px;display:grid;grid-template-columns:180px 260px 1fr;gap:14px;align-items:start}

/* ── PANEL ── */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface2);gap:8px}
.pt{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.count-badge{font-family:var(--mono);font-size:10px;color:var(--dim);flex-shrink:0}

/* ── SCROLLABLE LIST ── */
.ref-list{max-height:calc(100vh - 220px);overflow-y:auto}

/* ── CLIENT SECTION HEADER ── */
.client-hdr{
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;
  background:var(--surface3);
  border-bottom:1px solid var(--border);
  border-top:1px solid var(--border);
  font-family:var(--mono);font-size:10px;font-weight:600;
  color:var(--blue-bright);
  text-transform:uppercase;letter-spacing:.06em;
  position:sticky;top:0;z-index:2;
}
.client-hdr:first-child{border-top:none}
.client-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0}

/* ── PROJECT SUB-HEADER (inside items col) ── */
.project-hdr{
  padding:4px 12px 4px 20px;
  background:var(--surface2);
  border-bottom:1px solid rgba(37,51,82,.5);
  font-family:var(--mono);font-size:9px;
  color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;
  position:sticky;top:28px;z-index:1;
}

/* ── REF ROW ── */
.ref-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;
  border-bottom:1px solid rgba(37,51,82,.4);
  cursor:pointer;transition:background .1s;
  min-width:0;
}
.ref-item:last-child{border-bottom:none}
.ref-item:hover{background:var(--surface2)}
.ref-item.copied{background:rgba(16,185,129,.08)}
/* project rows get an indent */
.ref-item.indent{padding-left:20px}
/* item rows get double indent */
.ref-item.indent2{padding-left:28px}

.ref-name{font-family:var(--mono);font-size:11px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ref-code{font-family:var(--mono);font-size:10px;color:var(--dim);flex-shrink:0}
.copy-icon{font-size:11px;color:var(--dim);flex-shrink:0;opacity:0;transition:opacity .15s}
.ref-item:hover .copy-icon{opacity:1}
.ref-item.copied .copy-icon{opacity:1;color:var(--green)}

/* ── EMPTY / LOADING ── */
.empty{padding:24px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:11px;line-height:2}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}

/* ── COPY TOAST ── */
.copy-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--surface2);border:1px solid var(--green);border-radius:4px;
  padding:7px 18px;font-family:var(--mono);font-size:11px;color:var(--green);
  transition:transform .2s cubic-bezier(.22,1,.36,1);white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:999;pointer-events:none
}
.copy-toast.show{transform:translateX(-50%) translateY(0)}

/* ── NO CLIENT badge ── */
.no-client-hdr{
  padding:6px 12px;
  background:var(--surface2);border-bottom:1px solid var(--border);border-top:1px solid var(--border);
  font-family:var(--mono);font-size:10px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.06em;
  position:sticky;top:0;z-index:2;
}
.no-client-hdr:first-child{border-top:none}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <div class="wordmark">DK<span>H</span></div>
    <div class="vsep"></div>
    <div class="pg-title">Timesheet Reference</div>
  </div>
  <div class="hdr-r">
    <span class="last-updated" id="lastUpdated"></span>
    <button class="pill-btn" onclick="loadAll()">↻ Refresh</button>
  </div>
</header>

<div class="intro">
  <span>ℹ</span>
  <div><strong>Copy-paste reference for timesheet entry.</strong> Click any row to copy the exact name to your clipboard — paste it directly into your timesheet to ensure a precise match when importing. All data is grouped by client.</div>
</div>

<div class="global-search-wrap">
  <input class="global-search" id="globalSearch" placeholder="Search across clients, projects and items…" oninput="filterAll(this.value)">
</div>

<div class="main">

  <!-- CLIENTS -->
  <div class="panel">
    <div class="ph">
      <div class="pt">Clients</div>
      <span class="count-badge" id="clientCount"></span>
    </div>
    <div class="ref-list" id="clientList">
      <div class="empty"><span class="spin"></span><br>Loading…</div>
    </div>
  </div>

  <!-- PROJECTS grouped by client -->
  <div class="panel">
    <div class="ph">
      <div class="pt">Projects</div>
      <span class="count-badge" id="projectCount"></span>
    </div>
    <div class="ref-list" id="projectList">
      <div class="empty"><span class="spin"></span><br>Loading…</div>
    </div>
  </div>

  <!-- ITEMS grouped by client → project -->
  <div class="panel">
    <div class="ph">
      <div class="pt">Items</div>
      <span class="count-badge" id="itemCount"></span>
    </div>
    <div class="ref-list" id="itemList">
      <div class="empty"><span class="spin"></span><br>Loading…</div>
    </div>
  </div>

</div>

<div class="copy-toast" id="copyToast"></div>

<script>
const PROXY = '/.netlify/functions/notion-proxy';

let allClients  = [];
let allProjects = [];
let allItems    = [];

// ── LOAD ──────────────────────────────────────
async function loadAll(){
  setLoading();
  try{
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'reference-data' })
    });
    if(!res.ok) throw new Error('Proxy returned ' + res.status);
    const data = await res.json();
    allClients  = (data.clients  || []).sort((a,b) => a.name.localeCompare(b.name));
    allProjects = (data.projects || []).sort((a,b) => a.name.localeCompare(b.name));
    allItems    = (data.items    || []).sort((a,b) => a.name.localeCompare(b.name));
    document.getElementById('lastUpdated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-GB',{hour12:false});
    filterAll('');
  } catch(e){
    ['clientList','projectList','itemList'].forEach(id => {
      document.getElementById(id).innerHTML =
        '<div class="empty" style="color:var(--red)">Load failed:<br>' + esc(e.message) + '</div>';
    });
  }
}

function setLoading(){
  ['clientList','projectList','itemList'].forEach(id =>
    document.getElementById(id).innerHTML =
      '<div class="empty"><span class="spin"></span><br>Loading…</div>'
  );
  ['clientCount','projectCount','itemCount'].forEach(id =>
    document.getElementById(id).textContent = ''
  );
}

// ── FILTER & RENDER ───────────────────────────
function filterAll(q){
  q = (q || '').trim().toLowerCase();
  renderClients(q);
  renderProjects(q);
  renderItems(q);
}

// ── CLIENTS ──
function renderClients(q){
  const items = q ? allClients.filter(c => c.name.toLowerCase().includes(q)) : allClients;
  document.getElementById('clientCount').textContent = items.length + (q ? ' of '+allClients.length : '');
  document.getElementById('clientList').innerHTML = items.length
    ? items.map(c => `<div class="ref-item" onclick="copyText('${esc(c.name).replace(/'/g,"&#39;")}',this)" title="Click to copy">
        <span class="ref-name">${esc(c.name)}</span>
        <span class="copy-icon">⎘</span>
      </div>`).join('')
    : '<div class="empty">No matches.</div>';
}

// ── PROJECTS grouped by client ──
function renderProjects(q){
  const items = q
    ? allProjects.filter(p => p.name.toLowerCase().includes(q) || (p.client||'').toLowerCase().includes(q))
    : allProjects;

  document.getElementById('projectCount').textContent = items.length + (q ? ' of '+allProjects.length : '');

  if(!items.length){
    document.getElementById('projectList').innerHTML = '<div class="empty">No matches.</div>';
    return;
  }

  // Group by client
  const groups = groupBy(items, p => p.client || '');
  const clientNames = Object.keys(groups).sort((a,b) => a ? (b ? a.localeCompare(b) : -1) : 1);
  // Unlinked projects last
  const sorted = [...clientNames.filter(Boolean), ...clientNames.filter(n => !n)];

  let html = '';
  sorted.forEach(client => {
    html += client
      ? `<div class="client-hdr"><span class="client-dot"></span>${esc(client)}</div>`
      : `<div class="no-client-hdr">— No client —</div>`;
    html += groups[client]
      .sort((a,b) => a.name.localeCompare(b.name))
      .map(p => `<div class="ref-item indent" onclick="copyText('${esc(p.name).replace(/'/g,"&#39;")}',this)" title="Click to copy">
          <span class="ref-name">${esc(p.name)}</span>
          <span class="copy-icon">⎘</span>
        </div>`).join('');
  });

  document.getElementById('projectList').innerHTML = html;
}

// ── ITEMS grouped by client → project ──
function renderItems(q){
  const items = q
    ? allItems.filter(i =>
        i.name.toLowerCase().includes(q) ||
        (i.code   ||'').toLowerCase().includes(q) ||
        (i.project||'').toLowerCase().includes(q) ||
        (i.client ||'').toLowerCase().includes(q))
    : allItems;

  document.getElementById('itemCount').textContent = items.length + (q ? ' of '+allItems.length : '');

  if(!items.length){
    document.getElementById('itemList').innerHTML = '<div class="empty">No matches.</div>';
    return;
  }

  // Group by client, then project within each client
  const byClient = groupBy(items, i => i.client || '');
  const clientNames = [
    ...Object.keys(byClient).filter(Boolean).sort((a,b) => a.localeCompare(b)),
    ...Object.keys(byClient).filter(n => !n),
  ];

  let html = '';
  clientNames.forEach(client => {
    html += client
      ? `<div class="client-hdr"><span class="client-dot"></span>${esc(client)}</div>`
      : `<div class="no-client-hdr">— No client —</div>`;

    const clientItems = byClient[client];
    const byProject = groupBy(clientItems, i => i.project || '');
    const projNames = [
      ...Object.keys(byProject).filter(Boolean).sort((a,b) => a.localeCompare(b)),
      ...Object.keys(byProject).filter(n => !n),
    ];

    projNames.forEach(proj => {
      if(proj){
        html += `<div class="project-hdr">${esc(proj)}</div>`;
      }
      html += byProject[proj]
        .sort((a,b) => a.name.localeCompare(b.name))
        .map(it => {
          const indent = proj ? 'indent2' : 'indent';
          return `<div class="ref-item ${indent}" onclick="copyText('${esc(it.name).replace(/'/g,"&#39;")}',this)" title="Click to copy: ${esc(it.name)}">
            <span class="ref-name">${esc(it.name)}</span>
            ${it.code ? `<span class="ref-code">${esc(it.code)}</span>` : ''}
            <span class="copy-icon">⎘</span>
          </div>`;
        }).join('');
    });
  });

  document.getElementById('itemList').innerHTML = html;
}

// ── UTILS ──────────────────────────────────────
function groupBy(arr, keyFn){
  const out = {};
  arr.forEach(item => {
    const k = keyFn(item);
    if(!out[k]) out[k] = [];
    out[k].push(item);
  });
  return out;
}

let _toastTimer;
function copyText(text, el){
  const decoded = new DOMParser().parseFromString(text, 'text/html').body.textContent;
  navigator.clipboard.writeText(decoded).then(()=>{
    if(el){
      el.classList.add('copied');
      const icon = el.querySelector('.copy-icon');
      if(icon){ const prev = icon.textContent; icon.textContent='✓'; setTimeout(()=>{ el.classList.remove('copied'); icon.textContent=prev; },1400); }
    }
    const toast = document.getElementById('copyToast');
    toast.textContent = 'Copied: ' + decoded;
    toast.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
  }).catch(()=>{
    const inp = document.createElement('input');
    inp.value = decoded;
    document.body.appendChild(inp);
    inp.select();
    document.execCommand('copy');
    inp.remove();
  });
}

function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadAll();
</script>
</body>
</html>
